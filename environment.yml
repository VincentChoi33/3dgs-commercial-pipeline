name: gsplat
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pytorch>=2.1
  - torchvision
  - pytorch-cuda=12.1
  - numpy
  - scipy
  - opencv
  - ffmpeg
  - pip
  - pip:
      - plyfile
      - pyyaml
      - pycolmap
      - hloc @ git+https://github.com/cvg/Hierarchical-Localization@c13273bd0ecc2917a35910fd843712a1c6243193
      - gsplat>=1.5,<2
      - lightning>=2.4,<3
      - jsonargparse[signatures]>=4.35,<5
