name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.1,<3"
          python -m pip install ".[dev]"
      - name: Unit tests
        run: pytest -q
      - name: CLI smoke
        run: |
          gs-pipeline --help
          python pipeline.py --help
      - name: Benchmark manifest
        run: python scripts/validate_benchmarks.py
      - name: Repository hygiene
        run: |
          test -z "$(git ls-files | grep -E '(__pycache__|\.py[co]$|\.pytest_cache)' || true)"
          git diff --check
