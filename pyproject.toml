[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussian-splatting-pipeline"
version = "0.2.0"
description = "Quality-first reconstruction, training, export, compression, and reporting for 3D Gaussian Splatting"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "HandY_choi", email = "bigchoi3449@gmail.com" }
]
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.8,<6",
  "plyfile>=1.0,<2",
  "PyYAML>=6,<7",
  "torch>=2.1,<3"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10"
]

[project.scripts]
gs-pipeline = "pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
